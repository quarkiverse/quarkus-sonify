# Sonify only makes sounds in dev mode: a production build ignores all of this.

#quarkus.sonify.enabled=false
#quarkus.sonify.volume=0.4
#quarkus.sonify.response-gap=350ms
# taps (the default) or bells
#quarkus.sonify.theme=bells

# A sound file for one status code: 418 I'm a teapot whistles like a kettle.
quarkus.sonify.status."418"=sounds/whistle.wav

# A MIDI file: 202 Accepted plays three rising notes, with the default piano of the JDK.
quarkus.sonify.status."202"=sounds/arpeggio.mid

# A soundfont replaces the instruments of all the MIDI sounds. Try this one: a single square-wave instrument.
#quarkus.sonify.soundfont=sounds/square.sf2

# No sound for a whole kind of request.
quarkus.sonify.method.options=off

# The custom sound "order-placed", played by @PlaySound on OrderService.place().
# The custom sound "audit" is not configured: it gets a sound of its own, derived from its name.
quarkus.sonify.sound."order-placed"=sounds/coin.wav

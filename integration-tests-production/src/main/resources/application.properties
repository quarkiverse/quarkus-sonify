# The first half of the opt-in, for the packaged application and for its tests
quarkus.sonify.production.enabled=true
quarkus.sonify.test.enabled=true

# The audio output is opened as usual, but nothing can be heard
quarkus.sonify.volume=0

# A sound file, which a native executable must contain
quarkus.sonify.sound."order-placed"=sounds/coin.wav
